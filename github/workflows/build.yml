name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install PySide6

      - name: Build EXE
        run: |
          pyinstaller --windowed --name Mon --icon Mon_Icon.ico main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mon-Windows-EXE
          path: dist/Mon/
